    <script>
        // Applies the theme before the first paint, so the page never flashes the wrong one: the
        // theme picked with the toggle during this visit, otherwise the visitor's clock (dark from
        // 7 PM to 8 AM). Same rule as src/constants/theme.js. Also clears the choice older versions
        // kept for good in localStorage.
        (function () {
            var theme;
            try {
                theme = sessionStorage.getItem('theme');
                localStorage.removeItem('theme');
            } catch (error) {
                theme = null;
            }
            if (theme !== 'light' && theme !== 'dark') {
                var hour = new Date().getHours();
                theme = hour >= 19 || hour < 8 ? 'dark' : 'light';
            }
            document.documentElement.classList.add(theme);
            document.documentElement.style.colorScheme = theme;
        })();
    </script>
